<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#F7F5F0;--card:#FFFFFF;--ink:#262626;--sub:#7A7A72;--line:#E6E2D8;--green:#1F3D2B;--green-soft:#E8EFE9;--gold:#A8874E;--amber:#FFF6DA;--amber-ink:#8A6A1F;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',-apple-system,sans-serif;font-size:16px;line-height:1.5}
  .wrap{max-width:560px;margin:0 auto;padding:18px 16px 60px}
  header{display:flex;align-items:flex-end;justify-content:space-between;padding:4px 2px 14px}
  header .brand{font-size:14px;color:var(--green);font-weight:700}
  header h1{margin:2px 0 0;font-size:22px;color:var(--green)}
  .refresh{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;font:inherit;font-size:14px;color:var(--ink)}
  .tabs{display:grid;grid-template-columns:repeat(4,1fr);background:#ECE9E1;border-radius:12px;padding:4px;margin-bottom:14px}
  .tab{border:none;background:none;border-radius:9px;padding:10px 2px;font:inherit;font-size:13px;letter-spacing:-.02em;font-weight:500;color:var(--sub)}
  .tab.on{background:#fff;color:var(--green);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.06)}
  .tab .n{display:inline-block;min-width:20px;margin-left:4px;padding:0 6px;border-radius:999px;background:var(--green);color:#fff;font-size:12px;line-height:20px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
  .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .name{font-size:18px;font-weight:700}
.name.tap{cursor:pointer;text-decoration:underline dotted;text-underline-offset:5px}
.name .tapi{font-size:14px;margin-left:4px;opacity:.7;text-decoration:none}
.ph{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:8px 0 4px;padding:10px 12px;border-radius:12px;background:#f3f6f2}
.ph b{font-size:17px;margin-right:auto}
.ph a.btn{text-decoration:none}
  .badge{font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px}
  .b-wait{background:var(--amber);color:var(--amber-ink)}
  .b-ok{background:var(--green-soft);color:var(--green)}
  .b-chg{background:#F1ECE2;color:#6B5A3A}
  .b-done{background:#EEEEEE;color:#888}
  .rows{display:grid;grid-template-columns:56px 1fr;gap:4px 10px;font-size:15px}
  .rows dt{color:var(--sub)}
  .rows dd{margin:0}
  .meta{font-size:12px;color:var(--sub);margin-top:8px}
  .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
  .btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:11px 14px;font:inherit;font-size:15px;font-weight:700;color:var(--ink)}
  .btn.pri{background:var(--green);border-color:var(--green);color:#fff}
  .btn.ghost{color:var(--green);border-color:var(--green)}
  .btn:disabled{opacity:.5}
  .panel{margin-top:12px;padding:12px;border-radius:10px;background:#FAF8F3;border:1px solid var(--line)}
  .panel label{display:block;font-size:13px;color:var(--sub);margin:0 0 6px}
  .panel input,.panel select{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;font:inherit;background:#fff;margin-bottom:10px}
  .msg{white-space:pre-wrap;font-size:14px;line-height:1.7;background:#FAF8F3;border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:12px}
  .check{display:flex;align-items:center;gap:8px;margin-top:12px;font-weight:700;font-size:15px}
  .check input{width:22px;height:22px;accent-color:var(--green)}
  .empty{text-align:center;color:var(--sub);padding:50px 0}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 13px;font:inherit;font-size:15px;color:var(--ink)}
  .chip.on{background:var(--green);border-color:var(--green);color:#fff}
  .sec{font-size:15px;font-weight:700;margin-bottom:6px}
  .help{font-size:13px;color:var(--sub);margin:0 0 12px}
  .dinput{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;font:inherit;background:#fff;margin-bottom:12px}
  .clist div{padding:8px 0;border-top:1px solid var(--line);font-size:15px}
  .clist div:first-child{border-top:none}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.on{opacity:.92}
  /* ── 책나무 테마 ── */
  :root{--bg:#F5F2EA;--line:#E4DED0;--green:#176943;--green-d:#0F4F31;--green-soft:#EAF2EC;--gold:#B08D57;--ink:#22261F;--sub:#7C7A70}
  .hero{display:block;margin:-18px -16px 16px;background:var(--green-d);color:#fff;padding:20px 18px 18px;position:relative;border-bottom:3px solid var(--gold)}
  .hero::after{content:"";position:absolute;left:18px;right:18px;bottom:8px;border-top:1px solid rgba(176,141,87,.55)}
  .hero-in{display:flex;align-items:center;gap:14px;max-width:560px;margin:0 auto}
  .hero .mark{width:38px;height:auto;flex:none}
  .hero .bar-v{width:1px;align-self:stretch;background:rgba(176,141,87,.7)}
  .hero .brand{font-size:12px;letter-spacing:.12em;color:#E9DCC3;font-weight:500}
  .hero h1{margin:2px 0 0;font-family:'Noto Serif KR',serif;font-size:21px;font-weight:700;color:#fff}
  .hero .refresh{margin-left:auto;background:transparent;border:1px solid rgba(233,220,195,.6);color:#F3EAD8}
  .tabs{background:#fff;border:1px solid var(--line)}
  .tab.on{background:var(--green);color:#fff;box-shadow:none}
  .tab.on .n{background:#fff;color:var(--green)}
  .card{border-color:var(--line);border-radius:12px;box-shadow:0 1px 2px rgba(34,38,31,.04)}
  .sec{display:flex;align-items:center;gap:8px}
  .sec::before{content:"";width:3px;height:14px;background:var(--gold);border-radius:2px}
  .btn.pri,.chip.on{background:var(--green);border-color:var(--green)}
  .btn.ghost{color:var(--green);border-color:var(--green)}
  .b-ok{background:var(--green-soft);color:var(--green-d)}
  .mhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .mhead b{font-size:17px}
  .mnav{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:18px;color:var(--ink)}
  .msum{font-size:13px;color:var(--sub);margin:0 0 12px;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
  .mcal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
  .mdow{font-size:12px;color:var(--sub);text-align:center;padding:2px 0}
  .mday{min-height:62px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:4px 2px;font:inherit;display:flex;flex-direction:column;align-items:stretch;gap:2px;overflow:hidden;text-align:left}
  .mday .dn{font-size:12px;color:var(--ink);padding-left:2px}
  .mday.today{border-color:var(--gold)}
  .mday.sel{border-color:var(--green);box-shadow:inset 0 0 0 1px var(--green)}
  .tg{display:inline-block;font-size:11px;line-height:16px;border-radius:4px;padding:0 2px;letter-spacing:-.03em;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
  .tg.mk{background:#CFE0F5;color:#24466E;font-weight:700}
  .tg.ab{background:#F1C3BC;color:#6B3A33;font-weight:700}
  .mday .more{font-size:10px;color:var(--sub);padding-left:2px}
  .mlist .mdate{font-size:13px;font-weight:700;color:var(--green-d);padding:12px 0 4px;border-top:1px solid var(--line)}
  .mlist .mdate:first-child{border-top:none;padding-top:0}
  .mnm{display:inline-flex;align-items:center;gap:4px}
  .mfix{font:inherit;font-size:11.5px;font-weight:700;color:var(--green-d);background:#fff;border:1px solid #cfd8cc;border-radius:999px;padding:1px 8px;cursor:pointer;line-height:1.5}
  .mfix:disabled{opacity:.5}
  .mrow{display:flex;align-items:center;gap:6px;padding:5px 0;font-size:14px;flex-wrap:wrap}
  .mrow .mtx{color:var(--sub);font-size:13px;flex:1;min-width:120px}
  .mok{font-size:11px;color:#888;background:#EEE;border-radius:999px;padding:1px 7px}
  .mno{font-size:11px;color:var(--amber-ink);background:var(--amber);border-radius:999px;padding:1px 7px}
  .stbl{width:100%;border-collapse:collapse;font-size:14px}
  .stbl th,.stbl td{padding:8px 4px;border-top:1px solid var(--line);text-align:center}
  .stbl th{color:var(--sub);font-weight:500;border-top:none}
  .stbl td:first-child,.stbl th:first-child{text-align:left}
  .stbl td.left{color:#9A3B2E;font-weight:700}
  .tabs{gap:2px}
  .kd{font-size:12px;font-weight:700;border-radius:6px;padding:2px 7px;margin-left:8px;vertical-align:3px}
  .kd.k1{background:var(--green-soft);color:var(--green-d)}
  .kd.k2{background:#F3E6CC;color:#6E5226}
  .tg.tc{background:#E9E8E3;color:#3A3A35}
  .tabs{grid-template-columns:repeat(3,1fr)}
  .hero h1{font-size:18px;white-space:nowrap;line-height:1.4}
  .hero .refresh{white-space:nowrap}
  .kd.k3{background:#F6DADA;color:#8A2B22}
  .carnote{font-size:13px;margin:0 4px 12px;padding:10px 12px;border-radius:10px;background:#FFF6DA;color:#8A6A1F;line-height:1.6}

  /* 2026-11-17 원장 요청: 관리 화면 보기 편하게(글씨 키움·탭 정리) */
  body{font-size:17px}
  .tabs{grid-template-columns:repeat(3,1fr)!important;gap:4px;padding:6px}
  .tab{font-size:15.5px;padding:13px 2px;font-weight:600;color:var(--ink)}
  .tab .n{font-size:12.5px}
  .name{font-size:20px}
  .rows{font-size:16.5px;grid-template-columns:66px 1fr;gap:6px 10px}
  .meta{font-size:13.5px}
  .help{font-size:14.5px;line-height:1.6}
  .sec{font-size:16.5px}
  .msg{font-size:15.5px}
  .chip,.btn{font-size:16px}
  .msum{font-size:14.5px}
  .mdow{font-size:13px}
  .mday .dn{font-size:13.5px}
  .tg{font-size:12.5px;line-height:18px}
  .mlist .mdate{font-size:14.5px}
  .card{padding:18px}

  /* 2026-11-17 원장: 머리 한 줄로 얇게 */
  .hero{padding:10px 14px!important}
  .hero-in{gap:10px!important;align-items:center!important}
  .hero .mark{width:30px!important;height:auto!important}
  .hero .brand{font-size:11px!important;letter-spacing:.06em!important}
  .hero h1{font-size:15.5px!important;line-height:1.35!important;white-space:normal!important;margin:1px 0 0!important;letter-spacing:-.01em!important}
  .bar-v{display:none!important}

  /* 2026-11-17 원장: 로고 작게 학원 이름 앞, 제목 조금 크게 */
  .hero{padding:14px 16px!important}
  .hero .brand{display:flex!important;align-items:center;gap:6px;font-size:12.5px!important}
  .hero .mark-s{width:18px;height:auto;display:inline-block}
  .hero h1{font-size:19px!important;margin:6px 0 0!important;line-height:1.35!important}

  /* ── 오늘 한마디 ── */
  .tab[data-t="tn"]{grid-column:1/-1;font-weight:700;color:var(--green-d);background:#FBF7EF;border:1px solid #E8DCC4}
  .tab[data-t="tn"].on{background:var(--green-d);color:#fff;border-color:var(--green-d)}
  .tn-step{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 12px 12px;margin-bottom:10px;box-shadow:0 1px 2px rgba(34,38,31,.04)}
  .tn-h{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;margin-bottom:8px;color:var(--ink)}
  .tn-no{width:22px;height:22px;border-radius:50%;background:var(--green-d);color:#fff;font-size:12.5px;display:inline-flex;align-items:center;justify-content:center;flex:none;font-weight:700}
  .tn-opt{font-size:12.5px;color:var(--sub);font-weight:500}
  .tn-cnt{margin-left:auto;font-size:13px;color:var(--green);font-weight:700}
  .tn-mini{margin-left:auto;border:1px solid var(--line);background:#fff;border-radius:8px;padding:3px 9px;font:inherit;font-size:12.5px;color:var(--sub);font-weight:500}
  .tn-mini.on{border-color:var(--gold);color:#6E5226;background:#FBF7EF}
  .tn-sub{font-size:12.5px;color:var(--sub);margin:0 0 4px}
  .tn-chips{display:flex;flex-wrap:wrap;gap:5px}
  .tn-chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 10px;font:inherit;font-size:14px;line-height:1.35;color:var(--ink);text-align:left}
  .tn-chip.on{background:var(--green);border-color:var(--green);color:#fff}
  .tn-chip.on::before{content:"✓ ";font-weight:700}
  .tn-chip.off{color:#A9A69C;border-style:dashed;background:#FAF9F5}
  .tn-chip small{font-size:11.5px;opacity:.75;margin-left:3px}
  .tn-chip.tp{border-radius:9px;font-size:13.5px;padding:4px 9px}
  .tn-chip .x{display:inline-block;margin-left:6px;color:#9A3B2E;font-weight:700}
  .tn-time{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-top:1px dashed var(--line)}
  .tn-time.first{border-top:none}
  .tn-tbtn{flex:none;min-width:50px;border:1px solid var(--gold);background:#FBF7EF;color:#6E5226;border-radius:8px;padding:4px 6px;font:inherit;font-size:13px;font-weight:700}
  .tn-tbtn.on{background:var(--gold);color:#fff}
  .tn-grp{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--sub);margin:9px 0 5px}
  .tn-grp:first-of-type{margin-top:2px}
  .tn-dot{width:7px;height:7px;border-radius:50%;flex:none}
  .tn-in{width:100%;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:inherit;font-size:15px;background:#fff;color:var(--ink)}
  .tn-in:focus{outline:none;border-color:var(--green)}
  textarea.tn-in{resize:vertical;min-height:44px;line-height:1.5}
  .tn-add{display:flex;gap:6px;margin-top:6px}
  .tn-add .tn-in{padding:6px 9px;font-size:14px}
  .tn-add button{flex:none;border:1px solid var(--green);background:#fff;color:var(--green);border-radius:9px;padding:0 12px;font:inherit;font-size:14px;font-weight:700}
  .tn-photo{display:flex;align-items:center;justify-content:center;gap:8px;border:2px dashed #CFC6B2;border-radius:12px;background:#FBFAF6;min-height:74px;color:var(--sub);font-weight:700;font-size:15px;cursor:pointer;padding:8px}
  .tn-photo .cam{width:26px;height:26px;border-radius:7px;border:2px solid #B9AE95;position:relative}
  .tn-photo .cam::after{content:"";position:absolute;left:50%;top:50%;width:9px;height:9px;margin:-4.5px;border-radius:50%;border:2px solid #B9AE95}
  .tn-photo.has{border-style:solid;border-color:var(--line);background:#fff;justify-content:flex-start;cursor:default}
  .tn-photo img{width:84px;height:84px;object-fit:cover;border-radius:9px;display:block}
  .tn-photo .pinfo{font-size:13px;font-weight:500;color:var(--sub);line-height:1.5;flex:1}
  .tn-photo .pinfo b{display:block;color:var(--green-d);font-size:14px}
  .tn-help{font-size:12.5px;color:var(--sub);margin:6px 0 0;line-height:1.5}
  .tn-kakao{background:#B2C7D9;border-radius:12px;padding:10px 12px 12px}
  .tn-from{font-size:12px;color:#3D4B58;margin:0 0 5px 2px}
  .tn-bub{background:#fff;border-radius:4px 12px 12px 12px;overflow:hidden;max-width:310px;box-shadow:0 1px 1px rgba(0,0,0,.06)}
  .tn-bub-h{background:#FEE500;color:#3A1D1D;font-size:13px;font-weight:700;padding:7px 12px}
  .tn-bub-b{padding:10px 12px 8px;font-size:14px;line-height:1.6;white-space:pre-wrap;word-break:break-all;color:#222}
  .tn-bub-b .lk{color:#2A6FB0;text-decoration:underline}
  .tn-bub-b .ph0{color:#B0ADA5}
  .tn-bub-f{font-size:11.5px;color:#8E8E8E;padding:0 12px 10px;line-height:1.5;white-space:pre-line}
  .tn-bub-img{margin:10px 12px 0;background:#E8F2E2;border:1px solid #CFE3C6;border-radius:10px;padding:14px 12px;text-align:center}
  .tn-bub-img small{display:block;font-size:11.5px;color:#5E7A5A}
  .tn-bub-img b{display:block;font-size:18px;color:#1F5A36;letter-spacing:1px;margin-top:2px}
  .tn-bub-btn{margin:0 12px 12px;border:1px solid #E2E2E2;border-radius:6px;background:#F7F7F7;text-align:center;padding:9px 0;font-size:14px;color:#333}
  .tn-len{font-size:12px;color:var(--sub);text-align:right;margin-top:6px}
  .tn-len.over{color:#9A3B2E;font-weight:700}
  .tn-bar{position:sticky;bottom:0;z-index:5;margin:12px -16px 0;padding:10px 16px calc(12px + env(safe-area-inset-bottom));background:rgba(245,242,234,.97);border-top:1px solid var(--line);display:flex;align-items:center;gap:10px}
  .tn-bar .info{font-size:13px;color:var(--sub);flex:1;line-height:1.4}
  .tn-bar .info b{color:var(--green-d);font-size:16px}
  .tn-send{background:var(--green-d);color:#fff;border:none;border-radius:12px;padding:12px 20px;font:inherit;font-weight:700;font-size:16px;white-space:nowrap}
  .tn-send:disabled{background:#B9C3BC}
  .tn-warn{background:var(--amber);color:var(--amber-ink);font-size:13.5px;border-radius:10px;padding:9px 12px;margin-bottom:10px;line-height:1.5}
  .tn-res{border-left:3px solid var(--green)}
  .tn-res .ok{color:var(--green-d);font-weight:700}
  .tn-res .bad{color:#9A3B2E}
  .tn-log{font-size:13.5px}
  .tn-log .r{display:flex;gap:8px;align-items:baseline;padding:6px 0;border-top:1px solid var(--line)}
  .tn-log .r:first-child{border-top:none}
  .tn-log .t{color:var(--sub);font-size:12px;flex:none;width:38px}
  .tn-log .n{font-weight:700;flex:none}
  .tn-log .b{color:var(--sub);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12.5px}
  .tn-log .s{flex:none;font-size:11.5px;border-radius:999px;padding:1px 7px;background:var(--green-soft);color:var(--green-d)}
  .tn-log .s.no{background:#F6E3DF;color:#8A2B22}
  .tn-log .s.te{background:#EEE;color:#777}
  .tn-modal{position:fixed;inset:0;z-index:50;background:rgba(20,28,22,.45);display:flex;align-items:flex-end;justify-content:center}

function el(tag, attrs, ...kids){
  const e = document.createElement(tag);
  Object.entries(attrs || {}).forEach(([k,v]) => { if (k === 'on') Object.entries(v).forEach(([ev,f]) => e.addEventListener(ev,f)); else if (k === 'cls') e.className = v; else e.setAttribute(k, v); });
  kids.flat().forEach(k => { if (k == null || k === false) return; e.appendChild(typeof k === 'string' ? document.createTextNode(k) : k); });
  return e;
}
function toast(t, ms){ const x = $('toast'); x.textContent = t; x.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(() => x.classList.remove('on'), ms || 1600); }

const ADM_CK = 'adm_cache_' + String(KEY).slice(0, 6);
function admSave(){ try { localStorage.setItem(ADM_CK, JSON.stringify({ rows: ROWS, cs: CS, car: CAR })); } catch (e) {} }
function load(){
  let c = null; try { c = JSON.parse(localStorage.getItem(ADM_CK) || 'null'); } catch (e) {}
  if (c && c.rows) { ROWS = c.rows; if (c.cs) CS = c.cs; if (c.car) CAR = c.car; render(); }
  else $('list').innerHTML = '<div class="empty">불러오는 중...</div>';
  google.script.run.withSuccessHandler(r => { ROWS = r; render(); admSave(); })
    .withFailureHandler(e => { if (ROWS) return; $('list').innerHTML = ''; $('list').appendChild(el('div',{cls:'empty'}, (e && e.message) || '불러오지 못했습니다.')); })
    .adminData(KEY);
  google.script.run.withSuccessHandler(r => { CS = r; render(); admSave(); }).adminConsult(KEY);
  google.script.run.withSuccessHandler(r => { CAR = r; render(); admSave(); })
    .withFailureHandler(e => { CAR = { rows: [], sms: true, err: (e && e.message) || '불러오지 못했습니다.' }; render(); })
    .carAdminList(KEY);
}
function csCall(row, action, p, btn){
  if (btn) btn.disabled = true;
  google.script.run.withSuccessHandler(o => {
      if (o.deleted) { toast('삭제했습니다'); return load(); }
      CS = CS.map(r => r.row === o.row ? o : r); render();
      if (o.sent === 'ok') toast('학부모님께 상담 확정 알림톡을 보냈습니다');
      else if (o.sent && o.sent !== 'off') toast('알림톡 실패: ' + o.sent + ' · 직접 연락해 주세요', 3500);
    })
    .withFailureHandler(e => { if (btn) btn.disabled = false; toast((e && e.message) || '저장하지 못했습니다.'); })
    .adminConsultUpdate(KEY, row, action, p || {});
}
function csCard(r){

  card.appendChild(el('label',{cls:'check'}, chk, '상담 완료'));

  }}}, '삭제')));

// 공지 사진(A4 안내문)은 글씨가 보이게 더 크게: 긴 쪽 1800px, 약 1MB까지
function ntResize(file){
  const draw = (src, iw, ih) => {
    const sc = Math.min(1, 1800 / Math.max(iw, ih));
    const w = Math.round(iw * sc), h = Math.round(ih * sc);
    const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
    const cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, w, h); cx.drawImage(src, 0, 0, w, h);
    let q = 0.85, d = cv.toDataURL('image/jpeg', q);
    while (d.length > 1100000 && q > 0.45) { q -= 0.08; d = cv.toDataURL('image/jpeg', q); }
    return d;
  };
  if (window.createImageBitmap) return createImageBitmap(file, { imageOrientation: 'from-image' }).then(b => { const d = draw(b, b.width, b.height); if (b.close) b.close(); return d; }).catch(() => tnResizeImg(file, draw));
  return tnResizeImg(file, draw);
}
function tnResize(file){
  // 폰 사진(4000px·몇 MB)을 1024px·약 300KB로 줄여서 올림 — 학부모 폰 화면에는 이 정도면 충분
  const draw = (src, iw, ih) => {
    const max = 1024, sc = Math.min(1, max / Math.max(iw, ih));
    const w = Math.round(iw * sc), h = Math.round(ih * sc);
    const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
    const cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, w, h); cx.drawImage(src, 0, 0, w, h);
    let q = 0.72, d = cv.toDataURL('image/jpeg', q);
    while (d.length > 420000 && q > 0.4) { q -= 0.08; d = cv.toDataURL('image/jpeg', q); }
    return d;
  };
  if (window.createImageBitmap) {
    return createImageBitmap(file, { imageOrientation: 'from-image' }).then(b => { const d = draw(b, b.width, b.height); if (b.close) b.close(); return d; })
      .catch(() => tnResizeImg(file, draw));
  }
  return tnResizeImg(file, draw);
}
function tnResizeImg(file, draw){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); try { res(draw(img, img.naturalWidth, img.naturalHeight)); } catch (e) { rej(e); } };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('사진을 열지 못했습니다')); };
    img.src = url;
  });
}
function tnResizeOld_(file){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const max = 1280, sc = Math.min(1, max / Math.max(img.width, img.height));
      const w = Math.round(img.width * sc), h = Math.round(img.height * sc);
      const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
      const cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, w, h); cx.drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      let q = 0.8, d = cv.toDataURL('image/jpeg', q);
      while (d.length > 1100000 && q > 0.4) { q -= 0.1; d = cv.toDataURL('image/jpeg', q); }
      res(d);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('사진을 열지 못했습니다')); };
    img.src = url;
  });
}

    const setCnt = () => { const n = g.items.filter(t => TN_PH.includes(t)).length; cnt.textContent = n ? n + '개 고름' : ''; };
    setCnt();
    s2.appendChild(el('button',{cls:'tn-grp', style:'display:flex;align-items:center;width:100%;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;margin:6px 0 0;font:inherit;cursor:pointer;text-align:left', on:{click:() => { if (TN_EDIT) return; TN_OPEN[g.g] = !TN_OPEN[g.g]; render(); }}},
      el('span',{cls:'tn-dot', style:'background:' + TN_DOTS[gi % TN_DOTS.length]}), g.g, el('span',{style:'margin-left:6px;font-size:12.5px;color:var(--sub);font-weight:400'}, g.items.length + '개'), cnt,
      TN_EDIT ? null : el('span',{style:'margin-left:auto;color:var(--sub);font-size:14px'}, open ? '▲' : '▼')));
    if (!open) return;
    const chips = el('div',{cls:'tn-chips', style:'margin-top:6px'});
    g.items.forEach(t => {
      if (TN_EDIT) chips.appendChild(el('button',{cls:'tn-chip tp', on:{click:e => {
        if (e.target.classList.contains('x')) return tnAsk('이 문구를 지울까요?', t, '지우기', () => tnSavePhrases(TN.phrases.map(x => x === g ? { g: x.g, items: x.items.filter(y => y !== t) } : x), '지웠습니다'));
        const v = prompt('문구를 고쳐 주세요.', t); if (v == null) return; const nv = v.trim();
        if (!nv) return tnAsk('이 문구를 지울까요?', t, '지우기', () => tnSavePhrases(TN.phrases.map(x => x === g ? { g: x.g, items: x.items.filter(y => y !== t) } : x), '지웠습니다'));
        if (nv === t) return; if (g.items.includes(nv)) return toast('이미 있는 문구입니다');
        tnSavePhrases(TN.phrases.map(x => x === g ? { g: x.g, items: x.items.map(y => y === t ? nv : y) } : x), '고쳤습니다');
      }}}, t, el('span',{cls:'x'}, '×')));
      else chips.appendChild(el('button',{cls:'tn-chip tp' + (TN_PH.includes(t) ? ' on' : ''), 'data-p': t, on:{click:() => { TN_PH = TN_PH.includes(t) ? TN_PH.filter(x => x !== t) : TN_PH.concat(t); tnSync(); setCnt(); }}}, t));
    });
    s2.appendChild(chips);
    if (TN_EDIT) {
      const inp = el('input',{cls:'tn-in', placeholder:'새 문구 (예: ~했습니다.)', maxlength:'100'});
      const add = () => { const v = inp.value.trim(); if (!v) return; if (g.items.includes(v)) return toast('이미 있는 문구입니다'); tnSavePhrases(TN.phrases.map(x => x === g ? { g: x.g, items: x.items.concat(v) } : x), '더했습니다'); };
      inp.addEventListener('keydown', e => { if (e.key === 'Enter') add(); });
      s2.appendChild(el('div',{cls:'tn-add'}, inp, el('button',{on:{click:add}}, '더하기')));
    }
  });
  if (TN_EDIT) s2.appendChild(el('div',{style:'text-align:right;margin-top:10px'}, el('button',{cls:'tn-mini', on:{click:() => tnAsk('기본 문구로 되돌릴까요?', '직접 더한 문구는 지워집니다.', '되돌리기', () => tnSavePhrases('reset', '기본 문구로 되돌렸습니다'))}}, '기본 문구로 되돌리기')));
  else {
    s2.appendChild(el('div',{cls:'tn-grp'}, el('span',{cls:'tn-dot', style:'background:#9A9A92'}), '직접 쓰기 (선택)'));
    const ta = el('textarea',{cls:'tn-in', rows:'2', maxlength:'300', placeholder:'예) 오늘 발표를 아주 잘했습니다.'});
    ta.value = TN_EXTRA;
    ta.addEventListener('input', () => { TN_EXTRA = ta.value; tnPreview(); });
    s2.appendChild(ta);
  }

  // 2 사진 (문구보다 먼저)
  const s3 = el('div',{cls:'tn-step'}, el('div',{cls:'tn-h'}, el('span',{cls:'tn-no'}, '2'), '사진', el('span',{cls:'tn-opt'}, '선택')));
  if (TN_PHOTO) {
    s3.appendChild(el('div',{cls:'tn-photo has'}, el('img',{src: TN_PHOTO.thumb, alt:'올린 사진'}),
      el('div',{cls:'pinfo'}, el('b',{}, '사진을 올렸습니다'), '고른 학생 모두에게 같은 사진이 갑니다.'),
      el('button',{cls:'tn-mini', style:'margin-left:0', on:{click:tnRemovePhoto}}, '사진 빼기')));
  } else {
    if (TN_UP) { s3.appendChild(TN_UPTHUMB ? el('div',{cls:'tn-photo has'}, el('img',{src: TN_UPTHUMB, alt:'올리는 사진', style:'opacity:.6'}), el('div',{cls:'pinfo'}, el('b',{}, '사진 올리는 중...'), '그동안 학생과 문구를 골라 두세요.')) : el('div',{cls:'tn-photo'}, '사진 줄이는 중...')); } else {
      const mk = (cam, label) => { const fi = el('input', cam ? {type:'file', accept:'image/*', capture:'environment', style:'display:none'} : {type:'file', accept:'image/*', style:'display:none'}); fi.addEventListener('change', () => tnPickPhoto(fi.files && fi.files[0])); return el('label',{cls:'tn-photo', style:'flex:1;margin:0'}, fi, cam ? el('span',{cls:'cam'}) : null, label); };
      s3.appendChild(el('div',{style:'display:flex;gap:8px'}, mk(true, '사진 찍기'), mk(false, '앨범에서 고르기')));
    }
    s3.appendChild(el('div',{cls:'tn-help'}, '사진 한 장이 고른 학생 모두에게 같이 갑니다. 사진은 30일 뒤 자동으로 지워집니다.'));
  }
  box.appendChild(s3);
  box.appendChild(s2); // 3 문구

  // 미리 보기
  box.appendChild(el('div',{cls:'tn-step'}, el('div',{cls:'tn-h'}, el('span',{cls:'tn-no', style:'background:var(--gold)'}, '✓'), '학부모님이 받는 모습'),
    el('div',{cls:'tn-kakao'}, el('div',{cls:'tn-from'}, '책나무 산동독서논술학원'),
      el('div',{cls:'tn-bub'}, el('div',{cls:'tn-bub-h'}, '알림톡 도착'), el('img',{src: TN_HEAD_IMG, alt:'수업 속 한 장면', style:'display:block;width:100%'}), el('div',{cls:'tn-bub-b', id:'tn-pv'}),
        el('div',{cls:'tn-bub-f'}, '이 메시지는 수강 중인 학생의 학부모님께 보내 드리는 수업 안내입니다.\n상담 문의 010-2069-0885'), el('div',{cls:'tn-bub-btn', id:'tn-pvbtn', style:'display:none'}, '수업 사진 보기'))),
    el('div',{cls:'tn-len', id:'tn-len'})));

  // 오늘 보낸 기록
  const lg = el('div',{cls:'tn-step'}, el('div',{cls:'tn-h'}, '오늘 보낸 기록', el('span',{cls:'tn-cnt', style:'color:var(--sub);font-weight:500'}, (TN.log || []).length ? (TN.log.length + '건') : ''), (TN.log || []).length ? el('button',{cls:'tn-mini', on:{click:() => { tnStatusCheck(true); toast('카톡 도착을 확인하는 중...', 1500); }}}, '도착 확인') : null));
  setTimeout(() => tnStatusCheck(false), 300);
  if (!(TN.log || []).length) lg.appendChild(el('div',{cls:'tn-sub', style:'margin:0'}, '아직 보낸 한 장면이 없습니다.'));
  else {
    lg.appendChild(el('div',{cls:'tn-sub', style:'margin:0 0 6px'}, '× 를 누르면 기록만 지워집니다. 이미 간 알림톡은 취소되지 않아요.'));
    const L = el('div',{cls:'tn-log'});
    TN.log.forEach(o => {
      const r = o.result === '보냄' ? el('span',{cls:'s'}, '보냄') : /^테스트/.test(o.result) ? el('span',{cls:'s te'}, '테스트') : el('span',{cls:'s no', title:o.result}, '못 보냄');
      const dv = o.result !== '보냄' ? null : o.deliv === '도착' ? el('span',{style:'font-size:12px;font-weight:700;color:#176943;white-space:nowrap'}, '카톡 도착') : /^못 받음/.test(o.deliv) ? el('span',{style:'font-size:12px;font-weight:700;color:#B5523F;white-space:nowrap', title:o.deliv}, '못 받음') : o.ref ? el('span',{style:'font-size:12px;color:var(--sub);white-space:nowrap'}, '확인 중') : null;
      const row = el('div',{cls:'r'}, el('span',{cls:'t'}, o.ts), el('span',{cls:'n'}, o.name), el('span',{cls:'b'}, (o.photo ? '[사진] ' : '') + o.body.replace(/\n/g, ' ')), r, dv);
      row.addEventListener('click', e => { if (e.target.dataset.del) return; toast(o.result === '보냄' ? o.name + ' · 보냄' : o.name + ' · ' + o.result, 2600); });
      const del = el('button',{'data-del':'1', style:'border:none;background:none;font:inherit;font-size:13px;color:var(--sub);padding:2px 4px;cursor:pointer;white-space:nowrap'}, '×');
      del.addEventListener('click', ev => {
        ev.stopPropagation();
        if (!del.dataset.ask) { del.dataset.ask = '1'; del.textContent = '지우기'; del.style.color = '#B5523F'; del.style.fontWeight = '700'; setTimeout(() => { if (del.isConnected && del.dataset.ask) { delete del.dataset.ask; del.textContent = '×'; del.style.color = 'var(--sub)'; del.style.fontWeight = ''; } }, 5000); return; }
        del.disabled = true;
        google.script.run.withSuccessHandler(l => { TN.log = l; render(); toast('기록을 지웠습니다'); })
          .withFailureHandler(er => { del.disabled = false; toast((er && er.message) || '지우지 못했습니다', 2500); })
          .adminTnDeleteLog(KEY, o.row);
      });
      row.appendChild(del);
      L.appendChild(row);
      if (o.reply) L.appendChild(el('div',{style:'margin:-2px 0 6px 52px;padding:6px 10px;background:#FFF8E6;border-radius:8px;font-size:13.5px;color:#5A4410'}, '💬 학부모 답장: ' + o.reply));
    });
    lg.appendChild(L);
  }
  box.appendChild(lg);

  // 아래 고정 줄
  box.appendChild(el('div',{cls:'tn-bar'}, el('div',{cls:'info', id:'tn-info'}), el('button',{cls:'tn-mini', id:'tn-me', style:'margin:0;padding:10px 12px;white-space:nowrap', on:{click:tnMe}}, '내 폰으로 미리 받기'), el('button',{cls:'tn-send', id:'tn-send', on:{click:tnSend}}, '보내기')));
  tnSync();
}

document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => { TAB = t.dataset.t; render(); }));
$('refresh').onclick = () => { if (TAB === 'tn') { TN = null; TN_RES = null; } load(); };
load();
// 한 장면 보내기는 읽을 것이 많아서, 화면이 뜨자마자 뒤에서 미리 불러 둠
setTimeout(() => { if (!TN && !TN_LOADING) tnLoad(); }, 200);
</script>
</body>
