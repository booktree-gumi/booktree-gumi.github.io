<title>책나무 인덕독서논술학원 · 우리 아이 방</title>

<script>

  var API = 'https://script.google.com/macros/s/AKfycbz8_D5Gf0hjcqRxOSQcQhHK7wLICNepoOCzxdpnQKpxx5zMMfx_hnKgm1e7iCsAZ7phPw/exec';

<style>
:root{--g:#1f5a3d;--g2:#2f7a52;--gl:#e8f1ea;--gold:#c8922a;--goldl:#fbf1dc;--ink:#22302a;--sub:#6b7a72;--line:#dfe7e1}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#f4f5f2;font-family:'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;color:var(--ink);word-break:keep-all;-webkit-text-size-adjust:100%}
.wrap{max-width:480px;margin:0 auto;min-height:100vh;background:#f7f8f6}
.top{background:var(--g);color:#fff;padding:16px 16px 14px}
.ac{font-size:12.5px;opacity:.85}
.nm{font-size:22px;font-weight:800;margin-top:3px}.nm small{font-size:13px;font-weight:500;opacity:.85;margin-left:4px}
.sib{display:flex;gap:6px;margin-top:9px}
.sib button{flex:1;font:inherit;border:0;border-radius:12px;padding:9px 4px;font-weight:800;font-size:16px;background:rgba(255,255,255,.15);color:#dfeee4;cursor:pointer}
.sib button.on{background:#fff;color:var(--g)}.sib small{font-size:12px;font-weight:500}
.card{background:#fff;margin:10px 12px;border-radius:16px;padding:13px 14px;border:1px solid var(--line)}
.h{font-weight:800;font-size:15px;display:flex;align-items:center;gap:6px;margin-bottom:9px}
.h .more{margin-left:auto;font-size:13px;color:var(--sub);font-weight:500;background:none;border:0;font-family:inherit;cursor:pointer}
.row{display:flex;align-items:center;gap:10px;cursor:pointer}
.row img{width:42px;flex:none}
.bar{height:7px;background:var(--gl);border-radius:6px;margin-top:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--g2);border-radius:6px}
.tiny{font-size:12.5px;color:var(--sub)}.tiny b{color:var(--gold)}
.board{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin:12px 0 4px}
.st{aspect-ratio:1;border-radius:50%;border:1.3px dashed #cdd8d0}
.st.on{border:0;background:var(--g2)}.st.gold{background:var(--gold)}
.legend{display:flex;gap:12px;font-size:12px;color:var(--sub);margin:6px 0 2px}.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px}
.hist{margin-top:8px;border-top:1px dashed var(--line);padding-top:6px}
.hist div{display:flex;font-size:13.5px;padding:4px 0;gap:8px}.hist span:first-child{color:var(--sub);width:42px;flex:none}
.hist em{font-style:normal;margin-left:auto;font-weight:800;color:var(--g2)}.hist em.gold{color:var(--gold)}
.req{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.req a{display:block;text-align:center;text-decoration:none;border:1px solid var(--line);background:var(--gl);border-radius:12px;padding:12px 6px;font-weight:700;font-size:14.5px;color:var(--g)}
.state{margin-top:8px;font-size:13.5px;background:#f7f8f6;border-radius:10px;padding:8px 10px;display:flex;gap:6px;align-items:center}
.pill{font-size:11.5px;font-weight:700;border-radius:20px;padding:2px 9px;background:var(--g2);color:#fff;margin-left:auto;white-space:nowrap}
.pill.w{background:#e7a33c}.pill.x{background:#9aa5a0}
.note{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);text-decoration:none;color:inherit}
.note:first-of-type{border-top:0}
.ph{width:40px;height:40px;border-radius:9px;background:linear-gradient(135deg,#cfe3d4,#9fc4ab);flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px}
.ph.t{background:var(--gl);color:var(--g2)}
.note b{display:block;font-size:13.5px}.note span{font-size:12.5px;color:var(--sub);display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;max-width:250px}
.fb{font-size:14.5px;line-height:1.75;white-space:pre-wrap;color:#33423a}
.empty{font-size:13.5px;color:var(--sub);padding:4px 0}
.lock{max-width:360px;margin:70px auto 0;background:#fff;border-radius:20px;padding:28px 22px;text-align:center;border:1px solid var(--line)}
.lock img{width:90px}
.lock h1{font-size:19px;margin:10px 0 4px;color:var(--g)}
.lock p{font-size:14px;color:var(--sub);line-height:1.6}
.lock input{width:100%;font:inherit;font-size:26px;letter-spacing:12px;text-align:center;border:2px solid var(--g2);border-radius:14px;padding:10px;margin:16px 0 10px}
.lock button{width:100%;font:inherit;font-size:17px;font-weight:800;border:0;border-radius:14px;background:var(--g);color:#fff;padding:13px;cursor:pointer}
.err{color:#b4432b;font-size:13.5px;font-weight:700;min-height:20px;margin-top:8px}
.foot{text-align:center;font-size:12.5px;color:var(--sub);padding:14px 0 28px}.foot a{color:var(--g);font-weight:700;text-decoration:none}
.hide{display:none}
</style></head>

function save(v){ try { localStorage.setItem('room_' + TOKEN, v); } catch (e) {} }

function lockView(msg){
  $('app').innerHTML = '<div class="lock"><img src="' + SOLI + '" alt=""><h1>우리 아이 방</h1><p>책나무 인덕독서논술학원<br>학부모님 휴대폰 번호 <b>뒷자리 4개</b>를 넣어 주세요.<br><span style="font-size:12.5px">비번을 바꾸셨다면 바꾼 4자리를 넣어 주세요.</span></p>' +
    '<input id="pw" inputmode="numeric" maxlength="4" autocomplete="off"><button id="go">들어가기</button><div class="err" id="er">' + esc(msg || '') + '</div></div>';
  var pw = $('pw'); pw.focus();
  pw.addEventListener('input', function(){ pw.value = pw.value.replace(/\D/g, '').slice(0, 4); if (pw.value.length === 4) open_(pw.value); });
  $('go').onclick = function(){ open_(pw.value); };
}
function open_(v){
  if (v.length !== 4) { $('er') && ($('er').textContent = '4자리를 넣어 주세요.'); return; }
  if ($('go')) { $('go').disabled = true; $('go').textContent = '여는 중…'; }
  google.script.run.withSuccessHandler(function(d){ save(v); PW = v; D = d; try { localStorage.setItem('roomd_' + TOKEN, JSON.stringify(d)); } catch (e) {} render(); })

    .roomOpen(TOKEN, v);
}

  }
  function lines(ctx, text, maxW, font){ ctx.font = font; var o = []; text.split('\n').forEach(function(l){ o = o.concat(wrap(ctx, l.trim(), maxW)); }); return o; }
  function para(ctx, text, x, y, maxW, font, color, lh){ ctx.fillStyle = color; lines(ctx, text, maxW, font).forEach(function(l){ ctx.fillText(l, x, y + lh * 0.72); y += lh; }); return y; }
  function label(ctx, text, x, y){ ctx.fillStyle = C.gold; ctx.fillRect(x, y - 11, 34, 2); ctx.font = '600 30px ' + SANS; ctx.fillStyle = C.goldText; ctx.fillText(text, x + 50, y); }
  function rr(ctx, x, y, w, h, rad){ ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(x, y, w, h, rad); else { ctx.moveTo(x + rad, y); ctx.arcTo(x + w, y, x + w, y + h, rad); ctx.arcTo(x + w, y + h, x, y + h, rad); ctx.arcTo(x, y + h, x, y, rad); ctx.arcTo(x, y, x + w, y, rad); ctx.closePath(); } }
  function draw(ctx){
    var W = C.W, M = 44, P = 66, tx = M + P, tw = W - 2 * (M + P), H = ctx.canvas.height;
    var BODY = '400 38px ' + SANS, SOFT = '400 37px ' + SANS;
    ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
    ctx.save(); ctx.shadowColor = 'rgba(80,60,40,0.10)'; ctx.shadowBlur = 30; ctx.shadowOffsetY = 8;
    ctx.fillStyle = C.paper; ctx.fillRect(M, M, W - 2 * M, H - M - 96); ctx.restore();
    ctx.strokeStyle = C.frame; ctx.lineWidth = 2; ctx.strokeRect(M + 14, M + 14, W - 2 * M - 28, H - M - 96 - 28);
    var y = M + 64;
    if (FB_LOGO_IMG) { var k = 54 / FB_LOGO_IMG.height; ctx.drawImage(FB_LOGO_IMG, tx, y, FB_LOGO_IMG.width * k, 54); }
    else { ctx.font = '700 36px ' + SERIF; ctx.fillStyle = C.green; ctx.fillText(FB_BRANCH, tx, y + 40); }
    ctx.textAlign = 'right'; ctx.font = '700 32px ' + SERIF; ctx.fillStyle = C.goldText; ctx.fillText(r.mo + '월 수업 이야기', tx + tw, y + 40); ctx.textAlign = 'left';
    y += 92; ctx.fillStyle = C.rule; ctx.fillRect(tx, y, tw, 2);
    y += 92;
    ctx.font = '700 58px ' + SERIF; ctx.fillStyle = C.ink; ctx.fillText(r.name, tx, y);
    var nw = ctx.measureText(r.name).width;
    ctx.font = '400 34px ' + SANS; ctx.fillStyle = C.muted; ctx.fillText('학생', tx + nw + 14, y);
    y += 44;
    y = para(ctx, r.greet, tx, y, tw, SOFT, C.ink, 58) + 50;
    label(ctx, '이번 달 수업에서', tx, y + 8); y += 34;
    if (r.lesson) y = para(ctx, r.lesson, tx, y, tw, BODY, C.ink, 61) + 22;
    y = para(ctx, r.good, tx, y, tw, BODY, C.ink, 61) + 44;
    var n2 = lines(ctx, r.next, tw - 8, BODY).length, ph = 34 + 34 + 12 + n2 * 61 + 30;
    rr(ctx, tx - 34, y, tw + 68, ph, 22); ctx.fillStyle = C.panel; ctx.fill();
    label(ctx, '앞으로 이렇게 지도할게요', tx, y + 52);
    para(ctx, r.next, tx, y + 80, tw - 8, BODY, C.ink, 61);
    y += ph + 44;
    y = para(ctx, r.home, tx, y, tw, SOFT, C.ink, 58) + 14;
    y = para(ctx, r.close, tx, y, tw, '400 36px ' + SANS, C.muted, 57) + 40;
    ctx.textAlign = 'right'; ctx.font = '700 36px ' + SERIF; ctx.fillStyle = C.green; ctx.fillText(FB_BRANCH + ' 드림', tx + tw, y + 20); ctx.textAlign = 'left';
    y += 100;
    ctx.textAlign = 'center'; ctx.font = '400 28px ' + SANS; ctx.fillStyle = C.muted; ctx.fillText(FB_PHONE, W / 2, y + 62); ctx.textAlign = 'left';
    return y + 96;
  }
  var cv = document.createElement('canvas'); cv.width = C.W; cv.height = 4000;
  var h = draw(cv.getContext('2d')); cv.height = Math.ceil(h); draw(cv.getContext('2d'));
  return cv.toDataURL('image/jpeg', 0.9);
}

function render(){
  FBQ = [];
  var k = D.kids[CUR], b = D.board || 100;
  var h = '<div class="top"><div class="ac">책나무 인덕독서논술학원 · 우리 아이 방</div>';
  if (D.kids.length > 1) {
    h += '<div class="sib">' + D.kids.map(function(x, i){ return '<button data-i="' + i + '" class="' + (i === CUR ? 'on' : '') + '">' + esc(x.name) + ' <small>' + esc(x.grade) + '</small></button>'; }).join('') + '</div>';
  } else h += '<div class="nm">' + esc(k.name) + '<small>' + esc(k.grade) + '</small></div>';
  h += '</div>';

  // 학원 공지 (최근 것만)
  if (D.notices && D.notices.length) {
    h += '<div class="card"><div class="h">학원 공지' + (D.notices.length > 1 ? '<button class="more" data-t="nt2">' + (OPEN.nt2 ? '접기' : '지난 공지 ' + (D.notices.length - 1)) + '</button>' : '') + '</div>';
    (OPEN.nt2 ? D.notices : D.notices.slice(0, 1)).forEach(function(n, i){ h += (i ? '<div style="border-top:1px dashed var(--line);margin:10px 0"></div>' : '') + '<div class="tiny" style="margin-bottom:3px">' + md(n.t) + '</div><div class="fb">' + esc(n.text) + '</div>'; });
    h += '</div>';
  }
  // 칭찬 도장 (한 줄 → 누르면 도장판)
  var inBoard = k.total % b, nBoard = Math.floor(k.total / b) + 1;
  var gotGifts = (k.gifts || []).filter(function(g){ return g.state === '완료'; });
  h += '<div class="card"><div class="row" data-t="st"><img src="' + SOLI + '" alt=""><div style="flex:1"><div style="font-weight:800;font-size:14.5px">칭찬 도장 <span style="color:var(--g)">' + inBoard + '</span><span class="tiny"> / ' + b + (nBoard > 1 ? ' · ' + nBoard + '번째 판' : '') + '</span></div>' +
    '<div class="bar"><i style="width:' + Math.round(inBoard / b * 100) + '%"></i></div></div><span class="tiny">' + (OPEN.st ? '접기 ▲' : '보기 ▼') + '</span></div>';
  if (OPEN.st) {
    // 판에 찍힌 개수(inBoard)만큼 꼭 채움: 최근 도장부터 색을 정하고, 모자라면(예전 기록·기존 도장 한꺼번에) 칭찬색으로 채움
    var cells = [];
    // 등원 초록 · 칭찬 금색(2026-11-23 원장: 초록 하나로 했다가 "금색도 넣자 일단")
    k.stamps.forEach(function(s){ for (var j = 0; j < s.p && cells.length < inBoard; j++) cells.push(s.k === '등원' ? 'on' : 'on gold'); });
    while (cells.length < inBoard) cells.push('on gold');
    cells.reverse();
    h += '<div class="board">';
    for (var i = 0; i < b; i++) h += '<div class="st ' + (cells[i] || '') + '"></div>';
    h += '</div><div class="legend"><span><i style="background:var(--g2)"></i>등원</span><span><i style="background:var(--gold)"></i>칭찬</span></div>';
    if (D.gift) h += '<div class="tiny" style="margin-top:6px">' + b + '개를 다 모으면 <b>' + esc(D.gift) + '</b></div>';
    // 도장 선물: 학원에서 바꿔 준 기록만 보임(신청 버튼·단계 안내 없음)
    if (gotGifts.length) h += '<div style="margin-top:10px">' + gotGifts.slice(0, 5).map(function(g){ return '<div class="state">🎁 ' + md(g.t) + ' 도장 ' + g.n + '개로 선물 받았어요</div>'; }).join('') + '</div>';
    h += '<div class="hist">' + (k.stamps.length ? k.stamps.slice(0, 20).map(function(s){
      return '<div><span>' + md(s.d) + '</span>' + esc(s.k) + (s.m ? ' · ' + esc(s.m) : '') + '<em class="' + (s.k === '등원' ? '' : 'gold') + '">' + (s.p < 0 ? s.p : '+' + s.p) + '</em></div>'; }).join('') : '<div class="empty">아직 받은 도장이 없어요. 등원하는 날마다 하나씩 쌓여요.</div>') + '</div>';
  }
  h += '</div>';

  // 신청
  h += '<div class="card"><div class="h">신청하기</div><div class="req">' +
    [['보강 신청', '보강'], ['결석 알리기', '결석'], ['시간 변경', '시간변경'], ['차량 변경', '차량']].map(function(t){ return '<a href="' + D.apply + '?pk=' + TOKEN + '&pp=' + PW + '&nm=' + encodeURIComponent(k.name) + '&tab=' + encodeURIComponent(t[1]) + '" target="_top">' + t[0] + '</a>'; }).join('') +
    '<a href="#" id="askBtn" style="grid-column:1/-1;background:#fff;border:1.5px solid var(--g2)">학원에 요청하기</a></div>' +
    (OPEN.ask ? '<div style="margin-top:10px"><textarea id="askTx" rows="3" maxlength="500" placeholder="예) 다음 주 책 한 권 더 보내 주세요 / 상담 전화 부탁드려요" style="width:100%;font:inherit;font-size:15px;border:1.5px solid var(--g2);border-radius:12px;padding:10px"></textarea>' +
      '<button id="askGo" style="width:100%;margin-top:6px;font:inherit;font-weight:800;font-size:15px;border:0;border-radius:12px;background:var(--g);color:#fff;padding:11px;cursor:pointer">원장님께 보내기</button><div class="err" id="askEr"></div></div>' : '') +
    (k.asks || []).map(function(a){ return '<div class="state" style="display:block"><div style="display:flex;gap:6px"><span>' + md(a.t) + ' 요청</span><span class="pill ' + (a.reply ? '' : 'w') + '">' + (a.reply ? '답장 왔어요' : '전달됨') + '</span></div><div style="margin-top:4px;color:#3b4a42">' + esc(a.text) + '</div>' + (a.reply ? '<div style="margin-top:6px;padding-top:6px;border-top:1px dashed var(--line);color:var(--g);font-weight:700">학원: ' + esc(a.reply) + '</div>' : '') + '</div>'; }).join('') +
    k.reqs.map(function(r){ return '<div class="state">' + esc(r.label) + ' ' + esc(r.type === '시간변경' ? '시간 변경' : r.type) + '<span class="pill ' + (r.state === '확인 중' ? 'w' : r.state === '처리됨' ? 'x' : '') + '">' + esc(r.state) + '</span></div>'; }).join('') + '</div>';

  // 수업 속 한 장면 (있을 때만, 한 줄)
  if (k.notes.length) {
    var n0 = k.notes[0];
    h += '<div class="card"><div class="row" data-t="nt"><div class="ph">📷</div><div style="flex:1"><div style="font-weight:800;font-size:14.5px">수업 속 한 장면</div><div class="tiny">' + md(n0.d) + (k.notes.length > 1 ? ' · 모두 ' + k.notes.length + '번' : '') + '</div></div><span class="tiny">' + (OPEN.nt ? '접기 ▲' : '보기 ▼') + '</span></div>';
    if (OPEN.nt) h += '<div style="margin-top:8px">' + k.notes.map(function(n){ return '<a class="note" href="' + esc(n.url) + '" target="_top"><div class="ph' + (n.photo ? '' : ' t') + '">' + (n.photo ? '📷' : '✎') + '</div><div><b>' + md(n.d) + '</b><span>' + esc(n.text) + '</span></div></a>'; }).join('') + '</div>';
    h += '</div>';
  }

  // 피드백
  h += '<div class="card"><div class="h">수업 피드백' + (k.fbs.length > 1 ? '<button class="more" data-t="fb">' + (OPEN.fb ? '접기' : '지난 피드백 ' + (k.fbs.length - 1)) + '</button>' : '') + '</div>';
  if (!k.fbs.length) h += '<div class="empty">이달 피드백을 보내 드리면 여기에 모여요.</div>';
  else (OPEN.fb ? k.fbs : k.fbs.slice(0, 1)).forEach(function(f, i){ var p = fbParse(f, k.name);
    h += (i ? '<div style="border-top:1px dashed var(--line);margin:12px 0"></div>' : '') + '<div style="font-weight:800;color:var(--g);font-size:14px;margin-bottom:4px">' + esc(f.m) + '</div>' +
      (p ? '<div class="fbimg" data-fbi="' + FBQ.push(p) + '"><div class="fb" style="color:var(--sub)">불러오는 중…</div></div>' : '<div class="fb">' + esc(f.body) + '</div>'); });
  h += '</div>';

  h += '<div class="foot">문의 <a href="tel:01059554006">010-5955-4006</a></div>';
  $('app').innerHTML = h;
  fbDrawAll();
  [].forEach.call(document.querySelectorAll('.sib button'), function(x){ x.onclick = function(){ CUR = +x.getAttribute('data-i'); OPEN = {}; render(); }; });
  [].forEach.call(document.querySelectorAll('[data-t]'), function(x){ x.onclick = function(){ var t = x.getAttribute('data-t'); OPEN[t] = !OPEN[t]; render(); }; });
  $('askBtn').onclick = function(ev){ ev.preventDefault(); OPEN.ask = !OPEN.ask; render(); if (OPEN.ask) $('askTx').focus(); };
  if ($('askGo')) $('askGo').onclick = function(){
    var t = $('askTx').value.trim(), b = $('askGo');
    if (!t) { $('askEr').textContent = '내용을 적어 주세요.'; return; }
    b.disabled = true; b.textContent = '보내는 중…';
    google.script.run.withSuccessHandler(function(list){ D.kids[CUR].asks = list; OPEN.ask = false; render(); })
      .withFailureHandler(function(e){ b.disabled = false; b.textContent = '원장님께 보내기'; $('askEr').textContent = (e && e.message) || '잠시 후 다시 해 주세요.'; })
      .roomAsk(TOKEN, PW, k.name, t);
  };
}

// 속도: 전에 본 화면을 바로 보여 주고, 뒤에서 새로 불러와 바꿈
var s = saved(), last = null;
try { last = JSON.parse(localStorage.getItem('roomd_' + TOKEN) || 'null'); } catch (e) {}
if (s && last && last.kids) { PW = s; D = last; render(); open_(s); }
else if (s) { $('app').innerHTML = '<div class="lock"><img src="' + SOLI + '" alt=""><p style="margin-top:12px">여는 중…</p></div>'; open_(s); }
else lockView('');
</script></body></html>
