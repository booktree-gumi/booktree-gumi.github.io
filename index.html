<!DOCTYPE html>
<html lang="ko">
<head>

<meta charset="utf-8"><title>책나무 산동독서논술학원</title><link rel="icon" href="img/logo.png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f7f3e8; --card:#fffdf7; --ink:#2b3a2e; --soft:#6b7a6d;
    --green:#2f5d3a; --sage:#8fae8b; --line:#e4dccb;
    --c1:#c8553d; --c2:#2f5d3a; --c3:#03c75a; --c4:#f2c230; --c5:#5c7f9e;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--paper)}
  body{font-family:'Gowun Dodum',sans-serif;color:var(--ink);min-height:100vh;
    background-image:radial-gradient(#e9e1cd 1px,transparent 1px);background-size:18px 18px}
  .wrap{max-width:440px;margin:0 auto;padding:28px 18px 34px}

  header{text-align:center}
  .logo{width:104px;height:104px;border-radius:50%;display:block;margin:0 auto 12px;
    box-shadow:0 0 0 4px #fff,0 0 0 5px var(--line),0 6px 16px rgba(47,93,58,.18)}
  h1{font-family:'Jua',sans-serif;font-weight:400;font-size:25px;color:var(--green);letter-spacing:-.5px}
  .handle{font-size:13px;color:var(--soft);margin-top:2px}
  .tag{margin-top:12px;font-size:15px;line-height:1.55}
  .chips{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:10px}
  .chips span{font-size:12.5px;padding:4px 10px;border-radius:99px;background:#fff;border:1px solid var(--line);color:var(--green)}

  /* 책솔이 + 말풍선 */
  .guide{position:relative;display:flex;align-items:flex-end;justify-content:flex-end;
    height:112px;margin:18px 4px -8px}
  .guide img{width:118px;height:auto;position:relative;z-index:2;filter:drop-shadow(0 4px 6px rgba(0,0,0,.08))}
  .bubble{position:absolute;left:6px;bottom:44px;background:#fff;border:1.5px solid var(--green);
    border-radius:16px;padding:9px 14px;font-family:'Jua',sans-serif;font-size:16px;color:var(--green)}
  .bubble:after{content:"";position:absolute;right:-9px;bottom:14px;width:14px;height:14px;background:#fff;
    border-right:1.5px solid var(--green);border-top:1.5px solid var(--green);transform:rotate(45deg)}

  /* 책장 */
  .shelf{position:relative;z-index:1;background:var(--card);border:1px solid var(--line);border-radius:18px;
    padding:12px;box-shadow:0 8px 22px rgba(60,50,20,.07)}
  .shelf:before{content:"";position:absolute;left:14px;right:14px;top:-5px;height:8px;border-radius:6px;background:#b98d5b}

  a.book{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit;background:#fff;
    border:1px solid var(--line);border-radius:12px;padding:13px 14px 13px 0;margin:8px 0;overflow:hidden;
    transition:transform .12s ease,box-shadow .12s ease}
  a.book:active{transform:scale(.98)}
  @media (hover:hover){a.book:hover{transform:translateY(-2px);box-shadow:0 6px 14px rgba(0,0,0,.07)}}
  .spine{align-self:stretch;width:10px;margin:-13px 0;flex:none;border-radius:0 4px 4px 0}
  .ico{width:40px;height:40px;flex:none;border-radius:11px;display:grid;place-items:center}
  .ico svg{width:22px;height:22px}
  .txt{flex:1;min-width:0}
  .txt b{display:block;font-family:'Jua',sans-serif;font-weight:400;font-size:18px;letter-spacing:-.3px}
  .txt small{display:block;font-size:13px;color:var(--soft);margin-top:2px}
  .arr{flex:none;color:#b9b2a2;font-size:20px}

  .hot{border:1.5px solid var(--c1);background:linear-gradient(90deg,#fff6f2,#fff)}
  .new{display:inline-block;font-family:'Gowun Dodum',sans-serif;font-size:11px;color:#fff;background:var(--c1);
    border-radius:99px;padding:2px 7px;margin-left:6px;vertical-align:3px}

  footer{text-align:center;margin-top:22px;font-size:12.5px;color:var(--soft);line-height:1.7}
  footer img{width:64px;display:block;margin:0 auto 4px;opacity:.95}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img class="logo" src="img/logo.png" alt="책나무 산동독서논술학원">
    <h1>책나무 산동독서논술학원</h1>
    <div class="handle">@booktree_gumi · 구미 산동</div>
    <p class="tag">독서로 미래의 인재를 코칭합니다</p>
    <div class="chips"><span>비문학</span><span>한국사·세계사</span><span>문학 정리</span><span>신문 읽기</span><span>교과 연계</span></div>
  </header>

  <div class="guide">

  <nav class="shelf">

      <span class="spine" style="background:var(--c1)"></span>
      <span class="ico" style="background:#fbe4dd;color:var(--c1)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2v20M2 12h20M5 5l14 14M19 5L5 19"/></svg></span>
      <span class="txt"><b>겨울방학 특강 신청<span class="new">접수 중</span></b><small>몰입독서 특강 · 선착순 신청</small></span>
      <span class="arr">›</span>
    </a>
    <a class="book" href="https://m.place.naver.com/place/1898622309/booking" target="_top">
      <span class="spine" style="background:var(--c3)"></span>
      <span class="ico" style="background:#dff6e8;color:#049a47"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></span>
      <span class="txt"><b>네이버 예약</b><small>방문 상담 예약</small></span>
      <span class="arr">›</span>
    </a>
    <a class="book" href="https://m.blog.naver.com/booktree5004" target="_top">
      <span class="spine" style="background:var(--c5)"></span>
      <span class="ico" style="background:#e3ebf2;color:var(--c5)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h6a2 2 0 012 2v12a2 2 0 00-2-2H4zM20 5h-6a2 2 0 00-2 2v12a2 2 0 012-2h6z"/></svg></span>
      <span class="txt"><b>블로그</b><small>수업 이야기 · 아이들 활동 모음</small></span>
      <span class="arr">›</span>
    </a>
    <a class="book" href="https://open.kakao.com/o/sqtn9JWc" target="_top">
      <span class="spine" style="background:var(--c4)"></span>
      <span class="ico" style="background:#fdf3cf;color:#8a6a00"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3C6.5 3 2 6.6 2 11c0 2.8 1.9 5.3 4.7 6.7L5.8 21l3.9-2.6c.7.1 1.5.2 2.3.2 5.5 0 10-3.6 10-8S17.5 3 12 3z"/></svg></span>
      <span class="txt"><b>오픈 채팅</b><small>카카오톡으로 편하게 물어보세요</small></span>
      <span class="arr">›</span>
    </a>
    <a class="book" href="https://naver.me/5B12ialY" target="_top">
      <span class="spine" style="background:var(--c2)"></span>
      <span class="ico" style="background:#e3ece2;color:var(--c2)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11a7 7 0 0114 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg></span>
      <span class="txt"><b>오시는 길</b><small>신당1로2길 15 6층</small></span>
      <span class="arr">›</span>
    </a>
  </nav>

  <footer>
    <img src="img/hooray.png" alt="">
    책나무 산동독서논술학원
  </footer>
</div>
</body>
</html>
